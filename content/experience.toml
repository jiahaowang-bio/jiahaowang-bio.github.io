[[items]]
title = "Protein Evolution Modeling with PLMs and Inverse Folding"
group = "Research"
subtitle = "Overseas internship project · Project lead · McGill University, Canada"
date = "Jun 2025 — Jun 2026"
content = """
- **Research content:** Integrate multiple protein language models (PLMs), inverse-folding algorithms, and SCA coevolution analysis to build a general protein evolution model. Evaluate model feasibility using deep mutational scanning (DMS) benchmarks, apply the model to BFP and CYP enzymes, and validate mutation effects through mutant-expression experiments.
- **My responsibilities:** Review literature, integrate algorithms, build models, and conduct DMS benchmarking.
- **Host institution:** McGill University, Canada.
"""
tags = ["Protein Language Models", "Inverse Folding", "DMS Benchmarking"]

