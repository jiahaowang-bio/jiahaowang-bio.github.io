title = "Computational Study of Silk Fibroin Conformational Changes and Wound Healing"
group = "Research"
subtitle = "University–industry collaborative project · Project lead"
date = "Sep 2025 — May 2026"
content = """
- **Research content:** Study the conformational changes and self-assembly of soluble silk fibroin into films at wound sites, and its interactions with integrins as an extracellular matrix (ECM) material. Combine molecular dynamics simulations with cell-based experiments, including scratch assays, to validate simulation results and investigate wound-healing mechanisms.
- **My responsibilities:** Review prior literature, design experiments, conduct molecular dynamics simulations, and perform cell-based validation.
- **Industry partner:** Shanghai Sisu Technology Co., Ltd.
"""
