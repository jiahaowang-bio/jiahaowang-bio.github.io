content = """
**Research topic:** Ordinal-regression modeling for diabetic retinopathy grading in the context of Healthy China 2030.

- **Methods:** Integrate CBAM attention into EfficientNet-B2, use weighted random sampling, and reformulate five-level grading as a CORAL ordinal-regression task. Train jointly for DR grading and segmentation of four lesion categories, including microaneurysms and hemorrhages.
